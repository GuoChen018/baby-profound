name: Deploy to GitHub Pages

# Trigger on every push to main, and allow manual reruns from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployments need these two permissions on the GITHUB_TOKEN.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time. Don't cancel an in-flight prod deploy if a
# new commit lands — let the previous one finish so we never end up with a
# half-deployed artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (next export → out/)
        # `output: "export"` in next.config.ts produces a static site under `out/`.
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
